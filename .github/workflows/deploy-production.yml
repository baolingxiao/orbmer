# Auto-deploy to Vultr when main is pushed.
# One-time setup in GitHub → Settings → Secrets and variables → Actions:
#   DEPLOY_HOST          e.g. root@45.32.91.40
#   DEPLOY_SSH_KEY       private key contents (ed25519/rsa) that can SSH as that user
#   DEPLOY_PATH          optional, default /var/www/printnova
#
# Never store production .env in the repo. Server keeps its own .env.

name: Deploy production

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_SSH_KEY:-}" || { echo "Missing secret DEPLOY_SSH_KEY"; exit 1; }
          test -n "${DEPLOY_HOST:-}" || { echo "Missing secret DEPLOY_HOST"; exit 1; }

          if printf '%s' "$DEPLOY_SSH_KEY" | grep -q '^ssh-ed25519 \|^ssh-rsa \|^ecdsa-'; then
            echo "DEPLOY_SSH_KEY looks like a PUBLIC key (ssh-ed25519/ssh-rsa)."
            echo "Paste the PRIVATE key (BEGIN OPENSSH...) or its base64 one-liner."
            exit 1
          fi

          mkdir -p ~/.ssh
          KEY="$DEPLOY_SSH_KEY"
          KEY="${KEY//$'\r'/}"
          KEY="$(printf '%s' "$KEY" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          # Prefer base64 one-liner (most reliable in GitHub Secrets UI).
          if ! printf '%s' "$KEY" | grep -q 'BEGIN .*PRIVATE KEY'; then
            if printf '%s' "$KEY" | grep -Eq '^[A-Za-z0-9+/=]+$'; then
              printf '%s' "$KEY" | base64 -d > ~/.ssh/deploy_key
            else
              KEY="$(printf '%s' "$KEY" | sed 's/\\n/\n/g')"
              printf '%s\n' "$KEY" > ~/.ssh/deploy_key
            fi
          else
            printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key

          if ! grep -q 'BEGIN .*PRIVATE KEY' ~/.ssh/deploy_key; then
            echo "DEPLOY_SSH_KEY could not be decoded into a private key."
            echo "Update the secret with either:"
            echo "  1) Full PEM (-----BEGIN OPENSSH PRIVATE KEY----- ...)"
            echo "  2) Or a single-line base64 of that PEM file"
            exit 1
          fi

          HOST_ONLY="${DEPLOY_HOST#*@}"
          ssh-keyscan -H "$HOST_ONLY" >> ~/.ssh/known_hosts 2>/dev/null
          echo "HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"

          echo "Testing SSH to $DEPLOY_HOST ..."
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 \
            "$DEPLOY_HOST" "echo ssh_ok && hostname"

      - name: Rsync code
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          REMOTE="${DEPLOY_PATH:-/var/www/printnova}"
          # Never --delete uploads or runtime data: they are gitignored and live
          # only on the server. Without these excludes, every deploy wipes media.
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes" \
            --exclude node_modules \
            --exclude .git \
            --exclude .env \
            --exclude .env.* \
            --exclude 'server/runtime-data/' \
            --exclude 'web/assets/uploads/' \
            --exclude '.DS_Store' \
            --exclude 'assets/toys/jinqi/*.jpg' \
            ./ \
            "$HOST:$REMOTE/"

      - name: Install, migrate, restart
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          REMOTE="${DEPLOY_PATH:-/var/www/printnova}"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes "$HOST" "bash -s" <<REMOTE
          set -euo pipefail
          # Non-interactive SSH often misses nvm/pm2 on PATH
          export NVM_DIR="\$HOME/.nvm"
          if [ -s "\$NVM_DIR/nvm.sh" ]; then
            . "\$NVM_DIR/nvm.sh"
          fi
          export PATH="/usr/local/bin:/usr/bin:\$HOME/.nvm/versions/node/v22.22.0/bin:\$PATH"
          cd '$REMOTE'
          npm install --omit=dev
          npm run db:migrate
          npm run db:migrate-editorial || true
          if command -v pm2 >/dev/null 2>&1; then
            pm2 restart printnova || pm2 start server/index.js --name printnova
            pm2 save
            pm2 status printnova
          else
            echo "pm2 not found on PATH; attempting common nvm location"
            PM2_BIN="\$HOME/.nvm/versions/node/v22.22.0/bin/pm2"
            "\$PM2_BIN" restart printnova || "\$PM2_BIN" start server/index.js --name printnova
            "\$PM2_BIN" save
            "\$PM2_BIN" status printnova
          fi
          REMOTE
