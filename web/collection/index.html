<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Collection | Orbmare</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" /><link rel="stylesheet" href="/shared/css/editorial.css?v=15" /><link rel="stylesheet" href="/discover/discover.css?v=3" /></head>
<body class="discover-page"><div data-orb-header></div><main><section class="dx-hero shell-wide"><p class="dx-kicker" data-i18n="discover.collections.kicker">精选</p><h1 data-collection-title></h1><p class="dn-stamp" data-brand-stamp aria-hidden="true">Orbmare</p><p class="dx-hero-copy" data-collection-description></p></section><section class="dx-objects shell-wide"><div class="dx-object-grid" data-collection-grid></div><p class="dx-empty" data-collection-empty hidden data-i18n="discover.empty">暂时没有匹配的作品。</p></section></main><div data-orb-footer></div>
<script type="module">
import { mountChrome } from '/shared/js/chrome.js'; import { loadCatalog, escapeHtml } from '/shared/js/catalog-editorial.js'; import { applyI18n, getLang, onLangChange, loc, curatedBadge } from '/shared/js/editorial-i18n.js'; import { COLLECTIONS } from '/shared/js/discover-data.js';
mountChrome({title:'Collection | Orbmare'}); const id=new URLSearchParams(location.search).get('id'); const collection=COLLECTIONS.find(x=>x.slug===id)||COLLECTIONS[0]; let catalog={products:[]};
const matches=(p)=>collection.query.split(' ').some(term=>[p.country,p.material,p.materialZh,p.craft,p.craftZh,p.category,p.tag,loc(p,'name','en'),loc(p,'summary','en')].filter(Boolean).join(' ').toLowerCase().includes(term));
function render(lang=getLang()){applyI18n(lang);document.querySelector('[data-collection-title]').textContent=lang==='zh'?collection.zh:collection.en;document.querySelector('[data-collection-description]').textContent=lang==='zh'?'围绕一个值得停留的主题，选择少量作品。':'A small selection around a theme worth spending time with.';const products=catalog.products.filter(matches).slice(0,18);document.querySelector('[data-collection-grid]').innerHTML=products.map(p=>`<article class="dx-object-card"><a href="/product/?id=${encodeURIComponent(p.id)}"><div class="dx-object-media"><img src="${escapeHtml(p.image||'')}" alt="" width="640" height="480" loading="lazy"></div><p class="dx-object-meta">${escapeHtml(loc(p,'countryLabel',lang))} · ${escapeHtml(loc(p,'studio',lang)||p.designerName||'Orbmare')}</p><h3>${escapeHtml(loc(p,'name',lang))}</h3><p class="dx-object-summary">${escapeHtml(loc(p,'summary',lang)||'')}</p><div class="dx-object-bottom"><span class="dn-curated">${escapeHtml(curatedBadge(lang))}</span><span>${escapeHtml(p.priceLabel||'')}</span></div></a></article>`).join('');document.querySelector('[data-collection-empty]').hidden=products.length>0;}
try{catalog=await loadCatalog()}catch(error){console.error(error)}render();onLangChange(render);
</script></body></html>
