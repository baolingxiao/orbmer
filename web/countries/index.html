<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Orbmare Countries — Japan, Italy, and China." />
    <title>Countries | Orbmare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/shared/css/editorial.css?v=5" />
  </head>
  <body>
    <div data-orb-header></div>
    <main>
      <section class="page-hero shell-wide" data-module="countries">
        <h1 data-i18n="countries.title" data-editable="home.countriesTitle">国家馆</h1>
        <p data-i18n="countries.body" data-editable="home.countriesBody">MVP 聚焦：日本、意大利与中国。每一馆是文化、材料与工艺的研究，而非货架通道。</p>
      </section>
      <section class="section-tight shell-wide">
        <div class="country-rail reveal">
          <a class="country-tile" href="/countries/japan/">
            <img src="/assets/editorial/country-japan.jpg" alt="" width="900" height="1200" loading="lazy" />
            <div class="country-tile-copy"><span>Craftsmanship</span><strong>Japan · 日本</strong></div>
          </a>
          <a class="country-tile" href="/countries/italy/">
            <img src="/assets/editorial/country-italy.jpg" alt="" width="900" height="1200" loading="lazy" />
            <div class="country-tile-copy"><span>Luxury Design</span><strong>Italy · 意大利</strong></div>
          </a>
          <a class="country-tile" href="/countries/china/">
            <img src="/assets/editorial/country-china.jpg" alt="" width="900" height="1200" loading="lazy" />
            <div class="country-tile-copy"><span>Original Design</span><strong>China · 中国</strong></div>
          </a>
        </div>
      </section>
    </main>
    <div data-orb-footer></div>
    <script type="module">
      import { mountChrome } from "/shared/js/chrome.js";
      import { applyI18n, getLang, onLangChange } from "/shared/js/editorial-i18n.js";
      mountChrome({ title: "Countries | Orbmare" });
      applyI18n(getLang());
      onLangChange(applyI18n);
    </script>
  </body>
</html>
