<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Japan on Orbmare — Craftsmanship." />
    <title>Japan | Orbmare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/shared/css/editorial.css?v=4" />
  </head>
  <body>
    <div data-orb-header></div>
    <main>
      <section class="cover-hero" data-country-cover></section>
      <section class="section shell-wide country-history-section">
        <div class="country-history reveal" data-country-history></div>
      </section>
      <hr class="section-rule shell-wide" />
      <section class="section-tight shell-wide">
        <div class="section-head reveal">
          <h2 data-i18n="country.materials">材料</h2>
          <p data-i18n="country.materials.body">代表该国制作的材料。</p>
        </div>
        <div class="material-grid reveal" data-country-materials></div>
      </section>
      <section class="section-tight shell-wide">
        <div class="section-head reveal">
          <h2 data-i18n="country.crafts">工艺</h2>
          <p data-i18n="country.crafts.body">定义该国工坊的技艺。</p>
        </div>
        <div class="material-grid reveal" data-country-crafts></div>
      </section>
      <section class="section-tight shell-wide">
        <div class="section-head reveal">
          <h2 data-i18n="country.designers">精选设计师</h2>
          <p data-i18n="country.designers.body">我们甄选中的独立创作者与工作室。</p>
        </div>
        <div class="quiet-grid reveal" data-country-designers></div>
      </section>
      <section class="section shell-wide">
        <div class="section-head reveal">
          <h2 data-i18n="country.products">精选作品</h2>
          <p data-country-products-body data-i18n="country.products.jp">文具、厨刀、陶瓷、茶具与生活用品。</p>
        </div>
        <div class="quiet-grid reveal" data-country-products></div>
      </section>
    </main>
    <div data-orb-footer></div>
    <script type="module">
      import { mountCountryPage } from "/shared/js/country-page.js";
      mountCountryPage("japan");
    </script>
  </body>
</html>
