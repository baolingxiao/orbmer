<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Orbmare Craftsmanship" />
    <title>Craftsmanship | Orbmare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/shared/css/editorial.css?v=5" />
  </head>
  <body>
    <div data-orb-header></div>
    <main>
      <section class="page-hero shell-wide" data-module="craftsmanship">
        <h1 data-i18n="craft.title">工艺</h1>
        <p data-i18n="craft.body">制作即知识。每一种工艺都承载历史、地理与机器难以替代的标准。</p>
      </section>
      <section class="section-tight shell-wide">
        <div class="material-grid reveal" data-crafts></div>
      </section>
      <section class="section shell-wide" id="detail" hidden>
        <div class="prose reveal">
          <p class="meta" data-c-countries></p>
          <h2 data-c-name></h2>
          <p data-c-history></p>
        </div>
        <div class="section-tight">
          <div class="section-head"><h2 data-i18n="craft.products">相关作品</h2></div>
          <div class="quiet-grid" data-c-products></div>
        </div>
      </section>
    </main>
    <div data-orb-footer></div>
    <script type="module">
      import { mountChrome } from "/shared/js/chrome.js";
      import { loadCatalog, quietCardHtml, escapeHtml } from "/shared/js/catalog-editorial.js";
      import { applyI18n, getLang, loc, onLangChange } from "/shared/js/editorial-i18n.js";

      mountChrome({ title: "Craftsmanship | Orbmare" });
      const catalog = await loadCatalog();
      const crafts = Array.isArray(catalog.crafts) ? catalog.crafts : [];

      function historyText(craft, lang) {
        if (lang === "zh") return craft.historyZh || craft.history || craft.blurbZh || craft.blurb || loc(craft, "name", lang);
        return craft.history || craft.historyZh || craft.blurb || craft.blurbZh || loc(craft, "name", lang);
      }

      function render(lang = getLang()) {
        applyI18n(lang);
        document.querySelector("[data-crafts]").innerHTML = crafts
          .map((c) => {
            const countries = lang === "zh" ? c.countriesZh || c.countries : c.countries;
            return `<a class="material-tile" href="/craftsmanship/?id=${encodeURIComponent(c.id)}">
              <span>${escapeHtml(loc(c, "name", lang))}</span><small>${escapeHtml((countries || []).join(" · "))}</small></a>`;
          })
          .join("");

        const id = new URLSearchParams(location.search).get("id");
        const detail = document.querySelector("#detail");
        if (!id) {
          detail.hidden = true;
          return;
        }
        const c = crafts.find((x) => x.id === id);
        if (!c) {
          detail.hidden = true;
          return;
        }
        detail.hidden = false;
        document.querySelector("[data-c-name]").textContent = loc(c, "name", lang);
        const countries = lang === "zh" ? c.countriesZh || c.countries : c.countries;
        document.querySelector("[data-c-countries]").textContent = (countries || []).join(" · ");
        document.querySelector("[data-c-history]").textContent = historyText(c, lang);
        const related = catalog.products
          .filter(
            (p) =>
              String(p.craft || "")
                .toLowerCase()
                .replace(/\s+/g, "-") === c.id ||
              p.craft === c.name ||
              p.craftZh === c.nameZh
          )
          .slice(0, 6);
        document.querySelector("[data-c-products]").innerHTML = (
          related.length ? related : catalog.products.slice(0, 6)
        )
          .map((p) => quietCardHtml(p, lang))
          .join("");
      }

      render();
      onLangChange(render);
    </script>
  </body>
</html>
