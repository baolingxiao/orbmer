<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Orbmare Material Library" />
    <title>Material Library | Orbmare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/shared/css/editorial.css?v=15" />
    <style>
      .tech-hall {
        border-top: 1px solid var(--line, #e6e2dc);
        padding-top: clamp(56px, 8vw, 104px);
      }
      .tech-hall-head {
        display: grid;
        grid-template-columns: minmax(0, 0.9fr) minmax(280px, 1fr);
        gap: clamp(32px, 7vw, 120px);
        align-items: end;
        margin-bottom: clamp(32px, 5vw, 72px);
      }
      .tech-hall-kicker {
        margin: 0 0 18px;
        color: var(--muted, #777);
        font-size: 12px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }
      .tech-hall-title {
        margin: 0;
        font-family: "Cormorant Garamond", serif;
        font-size: clamp(52px, 8vw, 128px);
        font-weight: 500;
        line-height: 0.9;
        letter-spacing: -0.055em;
      }
      .tech-hall-copy {
        margin: 0;
        max-width: 680px;
        color: var(--muted, #666);
        font-size: clamp(17px, 1.5vw, 22px);
        line-height: 1.9;
      }
      .tech-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: clamp(18px, 2.6vw, 36px);
      }
      .tech-card {
        color: inherit;
        text-decoration: none;
      }
      .tech-card-media {
        aspect-ratio: 4 / 5;
        background: #f2f0ed;
        overflow: hidden;
      }
      .tech-card-media img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 900ms cubic-bezier(0.19, 1, 0.22, 1);
      }
      .tech-card:hover .tech-card-media img {
        transform: scale(1.035);
      }
      .tech-card-body {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px 18px;
        padding-top: 18px;
      }
      .tech-card h3 {
        margin: 0;
        font-size: clamp(20px, 1.8vw, 30px);
        font-weight: 500;
        line-height: 1.25;
      }
      .tech-card p,
      .tech-card small {
        margin: 0;
        color: var(--muted, #777);
        line-height: 1.65;
      }
      .tech-card-price {
        white-space: nowrap;
        font-family: "Cormorant Garamond", serif;
        font-size: 26px;
      }
      .tech-hall-empty {
        border: 1px solid var(--line, #e6e2dc);
        padding: 28px;
        color: var(--muted, #777);
      }
      .tech-custom {
        display: grid;
        grid-template-columns: minmax(0, .75fr) minmax(320px, 1fr);
        gap: clamp(28px, 6vw, 88px);
        margin-top: clamp(58px, 9vw, 120px);
        padding-top: clamp(28px, 5vw, 56px);
        border-top: 1px solid var(--line, #e6e2dc);
      }
      .tech-custom h3 { margin: 0; font-family: "Cormorant Garamond", serif; font-size: clamp(34px, 4vw, 54px); font-weight: 500; line-height: 1; }
      .tech-custom p { color: var(--muted, #777); line-height: 1.75; }
      .tech-custom-form { display: grid; gap: 14px; }
      .tech-custom-form label { display: grid; gap: 7px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted, #777); }
      .tech-custom-form input, .tech-custom-form select, .tech-custom-form textarea { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid var(--line, #ddd); border-radius: 0; background: transparent; color: var(--ink, #141414); font: 14px/1.5 "Noto Sans SC", sans-serif; }
      .tech-custom-form textarea { resize: vertical; min-height: 100px; }
      .tech-custom-form button { justify-self: start; }
      .tech-custom-note { margin: 0; font-size: 13px; }
      .tech-custom + .tech-grid { margin-top: clamp(58px, 9vw, 120px); }
      @media (max-width: 900px) {
        .tech-hall-head,
        .tech-grid,
        .tech-custom {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div data-orb-header></div>
    <main>
      <section class="page-hero shell-wide" data-module="materials">
        <h1 data-i18n="materials.title" data-editable="materials.title">材料馆</h1>
        <p class="dn-echo" data-i18n-echo="materials.title">Material Library</p>
        <p data-i18n="materials.body" data-editable="materials.body">傲马的招牌。先懂材料，再选作品——产地、特质与如何辨识品质。</p>
      </section>
      <section class="section-tight shell-wide">
        <div class="material-grid reveal" data-materials></div>
      </section>
      <section class="section-tight shell-wide tech-hall" id="technology">
        <div class="tech-hall-head reveal">
          <div>
            <p class="tech-hall-kicker" data-tech-kicker>Technology Hall</p>
            <h2 class="tech-hall-title" data-tech-title>科技馆</h2>
          </div>
          <p class="tech-hall-copy" data-tech-copy>
            从 3D 打印到未来材料应用，这里呈现 Orbmare 正在观察的技术物件。它们不属于传统材料分类，而是材料、工艺与新制造方式的交叉地带。
          </p>
        </div>
        <section class="tech-custom reveal" aria-labelledby="tech-custom-title">
          <div>
            <p class="tech-hall-kicker" data-custom-kicker>Custom fabrication</p>
            <h3 id="tech-custom-title" data-custom-title>定制 3D 打印</h3>
            <p data-custom-copy>金属工程件、人像手办或玩具模型均可提交。价格将根据模型、材料、尺寸、数量和后处理单独确认。</p>
          </div>
          <form class="tech-custom-form" data-custom-print-form>
            <label><span data-custom-type>打印类型</span><select name="printType" required><option value="metal">金属材料打印</option><option value="portrait">人像手办打印</option><option value="toy">普通玩具打印</option></select></label>
            <label><span>Email</span><input name="email" type="email" required placeholder="you@example.com" /></label>
            <label><span data-custom-description>需求说明</span><textarea name="description" required minlength="12" placeholder="用途、尺寸、数量、材料或表面效果；我们将在审核后单独报价。"></textarea></label>
            <label><span data-custom-file>模型文件（可选）</span><input name="files" type="file" multiple accept=".stl,.obj,.3mf,.step,.stp,.iges,.igs,.glb,.gltf,.glp,.zip" /></label>
            <button class="btn" type="submit" data-custom-submit>提交定制请求</button>
            <p class="tech-custom-note" data-custom-note>提交不产生订单或费用；我们会通过邮箱确认需求并报价。</p>
          </form>
        </section>
        <div class="tech-grid reveal" data-tech-products></div>
      </section>
    </main>
    <div data-orb-footer></div>
    <script type="module">
      import { mountChrome } from "/shared/js/chrome.js";
      import { loadCatalog, escapeHtml } from "/shared/js/catalog-editorial.js";
      import { applyI18n, getLang, loc, onLangChange, dualPairHtml } from "/shared/js/editorial-i18n.js";

      await mountChrome({ title: "Material Library | Orbmare" });
      const catalog = await loadCatalog();
      let technologyProducts = [];
      const customForm = document.querySelector("[data-custom-print-form]");

      async function loadTechnologyProducts() {
        try {
          const response = await fetch(`/api/catalog?t=${Date.now()}`, {
            credentials: "same-origin",
            cache: "no-store",
            headers: { Accept: "application/json" },
          });
          if (!response.ok) return [];
          const data = await response.json();
          return Array.isArray(data?.products) ? data.products : [];
        } catch {
          return [];
        }
      }

      function money(product) {
        const price = Number(product?.price || 0);
        const currency = product?.currency || "USD";
        if (!Number.isFinite(price) || price <= 0) return "";
        return new Intl.NumberFormat("en-US", {
          style: "currency",
          currency,
          maximumFractionDigits: price % 1 === 0 ? 0 : 2,
        }).format(price);
      }

      function renderTechnology(lang = getLang()) {
        const zh = lang === "zh";
        document.querySelector("[data-tech-kicker]").textContent = zh ? "未来制造" : "Future Materials";
        document.querySelector("[data-tech-title]").textContent = zh ? "科技馆" : "Technology Hall";
        document.querySelector("[data-tech-copy]").textContent = zh
          ? "从 3D 打印到未来材料应用，这里呈现 Orbmare 正在观察的技术物件。它们不属于传统材料分类，而是材料、工艺与新制造方式的交叉地带。"
          : "From 3D printing to future material applications, this hall presents technical objects Orbmare is watching — where materials, craft, and new manufacturing methods meet.";
        document.querySelector("[data-custom-kicker]").textContent = zh ? "按需制造" : "Custom fabrication";
        document.querySelector("[data-custom-title]").textContent = zh ? "定制 3D 打印" : "Custom 3D printing";
        document.querySelector("[data-custom-copy]").textContent = zh ? "金属工程件、人像手办或玩具模型均可提交。价格将根据模型、材料、尺寸、数量和后处理单独确认。" : "Submit an engineering metal part, portrait figurine, or toy model. We quote individually after reviewing the model, material, scale, quantity, and finish.";
        const root = document.querySelector("[data-tech-products]");
        const list = technologyProducts.slice(0, 6);
        root.innerHTML = list.length
          ? list
              .map((p) => {
                const copy = zh ? p.zh : p.en;
                const fallback = zh ? p.en : p.zh;
                const name = copy?.name || fallback?.name || p.id;
                const desc = copy?.desc || fallback?.desc || "";
                const image = p.image || p.images?.[0] || "/assets/editorial/materials/japanese-denim.jpg";
                return `<a class="tech-card" href="/product/?id=${encodeURIComponent(p.id)}">
                  <div class="tech-card-media"><img src="${escapeHtml(image)}" alt="" loading="lazy" /></div>
                  <div class="tech-card-body">
                    <div>
                      <small>${escapeHtml(p.material || (zh ? "未来材料" : "Future material"))}</small>
                      <h3>${escapeHtml(name)}</h3>
                      <p>${escapeHtml(desc)}</p>
                    </div>
                    <span class="tech-card-price">${escapeHtml(money(p))}</span>
                  </div>
                </a>`;
              })
              .join("")
          : `<div class="tech-hall-empty">${zh ? "科技馆商品发布后会显示在这里。" : "Published Technology Hall objects will appear here."}</div>`;
      }

      function render(lang = getLang()) {
        applyI18n(lang);
        document.querySelector("[data-materials]").innerHTML = catalog.materials
          .map((m) => {
            const zh = m.nameZh || m.name || m.id;
            const en = m.name || m.nameZh || m.id;
            return `<a class="material-tile" href="/materials/detail/?id=${encodeURIComponent(m.id)}">
              ${dualPairHtml(zh, en, lang)}
              <small>${escapeHtml(loc(m, "origin", lang))}</small>
            </a>`;
          })
          .join("");
        renderTechnology(lang);

        // Legacy ?id= links redirect into the magazine detail page.
        const id = new URLSearchParams(location.search).get("id");
        if (id) {
          location.replace(`/materials/detail/?id=${encodeURIComponent(id)}`);
        }
      }

      technologyProducts = await loadTechnologyProducts();
      customForm?.addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = customForm.querySelector("button[type='submit']");
        const note = customForm.querySelector("[data-custom-note]");
        button.disabled = true;
        try {
          const response = await fetch("/api/custom-print/requests", { method: "POST", body: new FormData(customForm) });
          const result = await response.json();
          if (!response.ok || !result.ok) throw new Error(result.error || "提交失败，请稍后再试。");
          customForm.reset();
          note.textContent = `已收到请求（${result.requestNumber}）。我们会通过邮箱联系你确认需求并报价。`;
        } catch (error) {
          note.textContent = error.message;
        } finally {
          button.disabled = false;
        }
      });
      render();
      onLangChange(render);
    </script>
  </body>
</html>
