<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Orbmare Material Intelligence — evidence-led material value." />
    <title>Material Intelligence | Orbmare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/shared/css/editorial.css?v=12" />
  </head>
  <body class="material-detail-page material-intelligence-page mi2-page">
    <div data-orb-header></div>
    <main data-material-detail>
      <section class="page-hero shell-wide">
        <p class="meta">Material</p>
        <h1>…</h1>
      </section>
    </main>
    <div data-orb-footer></div>
    <script type="module">
      import { mountChrome } from "/shared/js/chrome.js";
      import { mountMaterialDetail } from "/shared/js/material-detail.js";

      try {
        await mountChrome({ title: "Material | Orbmare" });
        await mountMaterialDetail(document.querySelector("[data-material-detail]"));
      } catch (error) {
        console.error("[material-detail]", error);
        const root = document.querySelector("[data-material-detail]");
        if (root) {
          root.innerHTML = `<section class="page-hero shell-wide"><h1>材料详情暂不可用</h1><p>${String(error.message || error)}</p><p style="margin-top:24px"><a class="btn btn-ghost" href="/materials/">返回材料馆</a></p></section>`;
        }
      }
    </script>
  </body>
</html>
