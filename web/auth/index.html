<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>账户 | 傲马 Orbmare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/shared/css/editorial.css?v=15" />
    <link rel="stylesheet" href="/auth/auth.css" />
  </head>
  <body>
    <header class="auth-top">
      <a class="brand" href="/"><strong>傲马</strong><span>Orbmare</span></a>
      <a class="auth-return" href="/discover/">返回探索</a>
    </header>

    <main class="auth-shell">
      <section class="auth-card" data-guest-view>
        <p class="brand-stamp">Orbmare</p>
        <h1>你的账户</h1>
        <p class="brand-slogan">保存订单、会员权益与下一次发现。</p>
        <p class="lede">使用 Google 或邮箱继续。订单会自动归入同一邮箱账户。</p>

        <div class="tabs">
          <button type="button" class="is-active" data-tab="login">登录</button>
          <button type="button" data-tab="register">注册</button>
        </div>

        <a class="google-sign-in" href="/auth/api/google" data-google-sign-in>
          <span aria-hidden="true">G</span> 使用 Google 继续
        </a>
        <div class="auth-divider" aria-hidden="true"><span>或使用邮箱</span></div>
        <p class="error" data-google-message hidden></p>

        <form data-login-form>
          <label>邮箱<input name="email" type="email" required autocomplete="username" /></label>
          <label>密码<input name="password" type="password" minlength="14" required autocomplete="current-password" /></label>
          <p class="error" data-login-error hidden></p>
          <button type="submit">登录</button>
        </form>

        <form data-register-form hidden>
          <label>昵称<input name="displayName" autocomplete="nickname" /></label>
          <label>邮箱<input name="email" type="email" required autocomplete="username" /></label>
          <label>密码（至少14位）<input name="password" type="password" minlength="14" required autocomplete="new-password" /></label>
          <p class="error" data-register-error hidden></p>
          <button type="submit">创建买家账户</button>
        </form>
      </section>

      <section class="auth-card" data-buyer-view hidden>
        <p class="brand-stamp">Orbmare</p>
        <h1>我的账户</h1>
        <p data-user-email></p>
        <p class="membership-state" data-membership-state></p>
        <div class="actions">
          <button type="button" data-link-orders>关联历史订单</button>
          <a href="/membership/" style="text-decoration:none"><button type="button" class="ghost">查看会员</button></a>
          <button type="button" class="ghost" data-logout>退出</button>
        </div>
        <section class="account-membership" data-account-membership>
          <h2>Membership</h2>
          <div data-account-membership-body></div>
        </section>
        <section class="account-concierge" data-account-concierge hidden>
          <h2>真人服务申请</h2>
          <form data-concierge-form>
            <label>服务类型
              <select name="serviceType">
                <option value="styling">穿搭建议</option>
                <option value="gift">礼物推荐</option>
                <option value="sourcing">商品寻货</option>
                <option value="purchasing">采购咨询</option>
                <option value="other">其他</option>
              </select>
            </label>
            <label>需求说明<textarea name="description" rows="4" required></textarea></label>
            <label>预算<input name="budget" placeholder="例：USD 300–500" /></label>
            <label>希望完成时间<input name="desiredDate" type="date" /></label>
            <label>商品链接（可选）<input name="productUrl" type="url" /></label>
            <label>图片链接（可选）<input name="attachmentUrl" type="url" /></label>
            <label>联系方式<input name="contactMethod" placeholder="邮箱、电话或偏好的联系方法" /></label>
            <label>国家或地区<input name="country" /></label>
            <p class="error" data-concierge-error hidden></p>
            <button type="submit">提交申请</button>
          </form>
        </section>
        <section class="account-requests" data-account-requests>
          <h2>服务申请记录</h2>
          <div data-concierge-requests></div>
        </section>
        <h2>我的订单</h2>
        <div data-orders></div>
        <section class="order-journey" data-order-journey hidden>
          <h2>Order Journey</h2>
          <div data-order-journey-body></div>
        </section>
      </section>

      <section class="auth-card" data-admin-view hidden>
        <p class="brand-stamp">Orbmare</p>
        <h1>管理员</h1>
        <p data-admin-email></p>
        <div class="admin-panel">
          <p>你已进入站点编辑权限。浏览任意页面时，模块旁会出现「+」以新增卡片；点击文字或图片即可修改。买家不会看到这些控件。</p>
          <div class="actions">
            <a href="/" style="text-decoration:none"><button type="button">进入全站编辑</button></a>
            <button type="button" class="ghost" data-logout>退出</button>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/auth/auth.js"></script>
  </body>
</html>
